<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02201A"/>
      <stop offset="1" stop-color="#1A0202"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g)"/>
  <g opacity="0.5">
    <polygon points="400,0 200,600 600,600" fill="#00E676" opacity="0.25"/>
  </g>
  <!-- turntable -->
  <g transform="translate(400,300)">
    <circle r="110" fill="#121212" stroke="#00E676" stroke-width="2" opacity="0.6"/>
    <circle r="80" fill="none" stroke="#00E676" stroke-width="1" opacity="0.3"/>
    <circle r="20" fill="#E10600" opacity="0.7"/>
    <circle r="6" fill="#0A0A0A"/>
  </g>
  <text x="400" y="560" font-family="'Bebas Neue',Impact,sans-serif" font-size="22" fill="#F5F5F5" opacity="0.35" text-anchor="middle" letter-spacing="4">ELETRÔNICA</text>
</svg>
